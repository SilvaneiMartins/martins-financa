name: Release

# Para publicar uma versão:
#   1. atualize a versão em apps/desktop/package.json, apps/desktop/src-tauri/Cargo.toml e apps/desktop/src-tauri/tauri.conf.json
#   2. git tag v0.1.0 && git push origin v0.1.0
# O workflow compila para Windows, macOS (Apple Silicon e Intel) e Linux
# e publica a Release com os instaladores (o site usa a última release para os downloads).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura de código (opcional) — remove os avisos de "desenvolvedor não identificado"
          # no macOS. Crie os secrets e descomente as linhas abaixo (veja a seção "Assinatura" do README).
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Martins Finança ${{ github.ref_name }}"
          releaseBody: |
            ## Downloads
            - **Windows:** arquivo `*_x64-setup.exe` (recomendado) ou `.msi`
            - **macOS Apple Silicon (M1–M4):** `*_aarch64.dmg`
            - **macOS Intel:** `*_x64.dmg`
            - **Linux:** `.AppImage` (qualquer distro), `.deb` (Ubuntu/Debian/Mint) ou `.rpm` (Fedora)

            Na primeira abertura o Windows/macOS podem avisar que o app é de desenvolvedor não identificado.
            Veja o README para liberar a execução.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
