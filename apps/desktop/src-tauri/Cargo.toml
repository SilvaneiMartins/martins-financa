[package]
name = "martins-financa"
version = "0.1.0"
description = "Martins Finança — gestão financeira pessoal e familiar, gratuita e open source"
authors = ["Agência Martins"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "martins_financa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
local-ip-address = "0.6"
rand = "0.8"
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
